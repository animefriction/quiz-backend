# ============================================================
# DEV Profile — H2 In-Memory Database (no MySQL needed)
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ============================================================

# ---- H2 Datasource ----
spring.datasource.url=jdbc:h2:mem:quizdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# ---- H2 Console (http://localhost:8080/h2-console) ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Disable mail in dev (prevent startup errors) ----
spring.mail.host=localhost
spring.mail.port=1025

# ---- Generative AI (Anthropic Claude) ----
# These are inherited from application.properties (always loaded), but repeated
# here for clarity. The key still comes from the ANTHROPIC_API_KEY env variable.
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-haiku-4-5